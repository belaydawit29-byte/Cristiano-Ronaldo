<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dawit AI Bot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #101522; color: white;
      min-height: 100vh; display: flex;
      justify-content: center; align-items: center;
    }
    .app {
      width: 100%; max-width: 600px; height: 100vh;
      max-height: 850px; display: flex; flex-direction: column;
      background: #171e2e; border-radius: 16px; overflow: hidden;
    }
    header {
      padding: 18px; background: #202b40;
      text-align: center; border-bottom: 1px solid #344158;
    }
    header h2 { margin: 0 0 5px; color: #72a7ff; }
    header p { margin: 0; color: #c3ccdc; font-size: 13px; }
    #chat {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      padding: 12px 14px; border-radius: 14px;
      max-width: 88%; white-space: pre-wrap;
      overflow-wrap: anywhere; line-height: 1.5;
    }
    .bot { background: #28354c; align-self: flex-start; }
    .user { background: #2463d4; align-self: flex-end; }
    .bottom { padding: 12px; background: #202b40; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1; min-width: 0; padding: 13px;
      border-radius: 10px; border: 1px solid #46536a;
      background: #101522; color: white; font-size: 16px;
    }
    button {
      padding: 12px 16px; border: 0; border-radius: 10px;
      background: #3979ed; color: white; font-weight: bold;
    }
    button:disabled { opacity: .5; }
    #status { font-size: 12px; color: #b7c3d6; margin: 8px 2px 0; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h2>🤖 Dawit AI Bot</h2>
      <p>Your AI assistant</p>
    </header>
    <section id="chat" aria-live="polite">
      <div class="msg bot">Hello! 👋 Welcome to Dawit AI Bot. How can I help you today?</div>
    </section>
    <div class="bottom">
      <form id="form">
        <input id="message" placeholder="Type your message..." autocomplete="off" required>
        <button id="send" type="submit">Send</button>
      </form>
      <div id="status">Ready</div>
    </div>
  </main>
  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");
    const status = document.getElementById("status");

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      status.textContent = "Thinking...";

      try {
        const response = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Request failed (" + response.status + ")");
        }
        addMessage(data.reply || "The AI returned an empty response.", "bot");
        status.textContent = "Ready";
      } catch (error) {
        addMessage("Sorry, I couldn't get a reply. " + error.message, "bot");
        status.textContent = "Connection error";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
